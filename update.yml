name: 🤖 Atualizar Painel MOVE

# Dispara quando um Excel for enviado para a pasta data/
# ou manualmente pelo botão "Run workflow" no GitHub
on:
  push:
    branches: [main]
    paths:
      - "data/**"
  workflow_dispatch:

permissions:
  contents: write   # necessário para o bot commitar o JSON gerado

jobs:
  processar:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Processar Excel → JSON
        run: python scripts/process.py

      - name: 💾 Commitar e publicar dados atualizados
        run: |
          git config --local user.email "bot@painel-move"
          git config --local user.name "Robô Painel MOVE"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos dados. Nada a commitar."
          else
            git commit -m "🤖 Dados atualizados em $(date +'%d/%m/%Y às %H:%M') (UTC)"
            git push
          fi
